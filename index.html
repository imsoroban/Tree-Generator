<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recursive Fractal Tree Generator</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <aside class="panel">
      <header class="panel__header">
        <h1>Fractal Tree</h1>
        <p class="subtitle">Recursive Canvas Renderer</p>
      </header>

      <div class="control-group">
        <div class="control">
          <div class="control__label">
            <label for="depth">Recursion Depth</label>
            <span class="control__value" id="depthValue">9</span>
          </div>
          <input type="range" id="depth" min="1" max="12" step="1" value="9" />
        </div>

        <div class="control">
          <div class="control__label">
            <label for="angle">Branch Angle</label>
            <span class="control__value" id="angleValue">25°</span>
          </div>
          <input type="range" id="angle" min="0" max="90" step="1" value="25" />
        </div>

        <div class="control">
          <div class="control__label">
            <label for="decay">Length Decay Ratio</label>
            <span class="control__value" id="decayValue">0.70</span>
          </div>
          <input type="range" id="decay" min="0.5" max="0.9" step="0.01" value="0.7" />
        </div>

        <div class="control">
          <div class="control__label">
            <label for="trunkHeight">Trunk Height</label>
            <span class="control__value" id="trunkHeightValue">140</span>
          </div>
          <input type="range" id="trunkHeight" min="50" max="300" step="1" value="140" />
        </div>

        <div class="control">
          <div class="control__label">
            <label for="trunkWidth">Trunk Width</label>
            <span class="control__value" id="trunkWidthValue">12</span>
          </div>
          <input type="range" id="trunkWidth" min="2" max="24" step="1" value="12" />
        </div>

        <div class="control">
          <div class="control__label">
            <label for="startHue">Trunk Hue</label>
            <span class="control__value" id="startHueValue">28°</span>
          </div>
          <input type="range" id="startHue" min="0" max="360" step="1" value="28" />
        </div>

        <div class="control">
          <div class="control__label">
            <label for="tipHue">Tip Hue</label>
            <span class="control__value" id="tipHueValue">132°</span>
          </div>
          <input type="range" id="tipHue" min="0" max="360" step="1" value="132" />
        </div>
      </div>

      <div class="button-row">
        <button id="randomizeBtn" class="btn btn--secondary">Randomize</button>
        <button id="resetBtn" class="btn btn--secondary">Reset</button>
      </div>
      <div class="button-row">
        <button id="exportBtn" class="btn btn--primary">Export PNG</button>
      </div>

      <footer class="panel__footer">
        <span id="statLabel">Branches: 0</span>
      </footer>
    </aside>

    <main class="canvas-container" id="canvasContainer">
      <canvas id="treeCanvas"></canvas>
    </main>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
